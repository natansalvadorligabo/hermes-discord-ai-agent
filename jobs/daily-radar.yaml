# The daily Radar. Install with: discord-agent jobs commands  (prints `hermes cron create ...`)
# The Radar posts itself to Discord (docs/adr/0001), so Hermes keeps the run log locally.
# Add `timezone: Area/City` to override the timezone set in your Hermes config.
name: daily-radar
schedule: "0 8 * * 1-5"
skills:
  - daily-radar
  - radar-feedback
deliver: local
prompt: >
  Build the Radar for today and post it to the Radar channel,
  following the daily-radar skill from its first step.
